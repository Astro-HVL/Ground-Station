; PlatformIO project for Teensy test telemetry
; Change default_envs if your board is different.

[platformio]
default_envs = teensy41

[env]
platform = teensy
framework = arduino
monitor_speed = 115200

[env:teensy41]
board = teensy41

[env:teensy40]
board = teensy40

[env:teensy36]
board = teensy36

[env:teensy35]
board = teensy35

[env:teensy31]
board = teensy31
