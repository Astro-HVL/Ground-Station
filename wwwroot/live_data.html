<!doctype html>
<html class="live-root">
<head>
  <meta charset="utf-8" />
  <title>Live Telemetry</title>
  <link rel="stylesheet" href="style.css?v=live3">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/microsoft-signalr/7.0.5/signalr.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.155.0/build/three.min.js"></script>
  <script src="rocket3d.js?v=live3"></script>
</head>
<body class="live-page">
  <div id="flightTimer"></div>

  <div class="live-container">
    <div id="top-row">
      <div id="top-left">
        <canvas id="altitudeChart" width="640" height="420"></canvas>
      </div>

      <div id="top-right">
        <div id="rocket3dContainer" class="white-circle hero-circle"></div>
      </div>
    </div>

    <div id="bottom-row">
      <div class="mode-section">
        <div class="mode-label">Rocket mode:</div>
        <div class="mode-pill">
          <div id="modeOn" class="mode-box">System Check</div>
          <div id="modeReady" class="mode-box">Operation Ready</div>
          <div id="modePending" class="mode-box">Lift-off</div>
          <div id="modeApogee" class="mode-box">Apogee</div>
          <div id="modeParachute" class="mode-box">Parachute Deployed</div>
        </div>
      </div>

      <div id="bottom-right"></div>
    </div>
  </div>

  <script src="live_data.js?v=live3"></script>
  <script src="cfdFlow.js?v=live3"></script>
  <div class="workspace-box" id="workspaceBox">
    <iframe
      id="cesiumFrame"
      class="workspace-cesium-frame"
      src="cesiumView.html?v=live3"
      title="Cesium Flight View"
      scrolling="no"
      loading="eager">
    </iframe>
  </div>

  <div class="bottom-bar">
    <div class="bottom-bar-inner">
      <div class="metric-card large">
        <div class="metric-title">Height</div>
        <div class="metric-value" id="circleAltValue">-</div>
        <div class="metric-unit">m</div>
      </div>
      <div class="metric-card large">
        <div class="metric-title">Speed</div>
        <div class="metric-value" id="circleVelValue">-</div>
        <div class="metric-unit">m/s</div>
      </div>
      <div class="metric-card large">
        <div class="metric-title">Force</div>
        <div class="metric-value" id="circleGValue">-</div>
        <div class="metric-unit">G</div>
      </div>
      <img src="bg/AstroHVL_hvit.png" alt="Astro HVL" class="bottom-bar-logo">
      <div class="sponsor-logos" aria-label="Sponsors">
        <img src="bg/Nammo1_logo.png" alt="Nammo" class="sponsor-logo sponsor-nammo">
        <img src="bg/ANSYS_logo.png" alt="Ansys" class="sponsor-logo sponsor-ansys">
        <img src="bg/CCB (hvit) (4).png" alt="CCB" class="sponsor-logo sponsor-ccb">
        <img src="bg/frifond.png" alt="Frifond" class="sponsor-logo sponsor-frifond">
        <img src="bg/sevenpeaks.png" alt="Seven Peak" class="sponsor-logo sponsor-sevenpeaks">
      </div>
    </div>
  </div>

  <div class="right-fixed-bar">
    <div class="right-inner">
      <div class="cfd-widget" aria-label="CFD Rocket Flow">
        <canvas id="cfdCanvas" width="144" height="300"></canvas>
      </div>
    </div>
  </div>
</body>
</html>
