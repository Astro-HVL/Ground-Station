<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Live Telemetry</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/microsoft-signalr/7.0.5/signalr.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.155.0/build/three.min.js"></script>
  <script src="rocket3d.js"></script>
</head>
<body>

  <!-- Flight time display (top center) -->
<div id="flightTimer" style="
  position: fixed; 
  top: 8px; 
  left: 50%; 
  transform: translateX(-50%);
  font-size: 28px; 
  font-weight: 700; 
  color: #c11818; 
  text-shadow: 0 2px 6px rgba(0,0,0,0.6);
  z-index: 1000;
  "></div>

  <div class="live-container">
    <!-- Top hero: left large grid chart, center globe+legend, right small rocket indicator -->
    <div id="top-row" style="display:flex; gap:24px; width:100%; align-items:flex-start;">
      <div id="top-left" style="flex:0 0 48%;">
        <!-- Altitude chart (top-left) -->
        <canvas id="altitudeChart" width="640" height="420" style="background:#0f1b49; border:1.5px solid #222; border-radius:6px;"></canvas>
      </div>
      <div id="top-right" style="flex:0 0 28%; display:flex; justify-content:flex-end;">
        <!-- 3D rocket (top-right) as a single white circular tile -->
        <div id="rocket3dContainer" class="white-circle hero-circle" style="width:260px; height:260px; display:flex; align-items:center; justify-content:center; background: linear-gradient(135deg, #000000, #3533cd); border:1px solid rgba(0,0,0,0.06);">
      <!---  <div id="rocket3dContainer" class="white-circle hero-circle" style="width:260px; height:260px; display:flex; align-items:center; justify-content:center; background:#ffffff; border:1px solid rgba(0,0,0,0.06);"> --->
        </div>
      </div>
    </div>

    <!-- Bottom Row -->
    <div id="bottom-row">
      <!-- Left section: Mode info -->
      <div class="mode-section">
      <div style="color:#d81111; font-size:36px; margin-bottom:6px;">Rocket mode:</div>
      <!---<div class="mode-pill" style="background:#0f1b49"> --->
      <div class="mode-pill" style="background: linear-gradient(135deg, #000000, #3533cd);">
        <div id="modeOn" class="mode-box">System Check</div>
        <div id="modeReady" class="mode-box">Operation Ready</div>
        <div id="modePending" class="mode-box">Lift-off</div>
        <div id="modeApogee" class="mode-box">Apogee</div>
        <div id="modeParachute" class="mode-box">Parachute Deployed</div>
      </div>
      </div>

      <div id="bottom-right" style="display:flex; gap:30px; align-items:flex-end;">
        <div class="white-circle hero-circle"  style="background: linear-gradient(135deg, #cd17c7, #e3e3e3);">
          <div class="metric-title">Height</div>
          <div class="metric-value" id="circleAltValue">-</div>
          <div class="metric-unit">m</div>
        </div>
        <div class="white-circle hero-circle"  style="background: linear-gradient(135deg, #000000, #3533cd);">
          <div class="metric-title">Speed</div>
          <div class="metric-value" id="circleVelValue">-</div>
          <div class="metric-unit">m/s</div>
        </div>
        <div class="white-circle hero-circle"  style="background: linear-gradient(135deg, #000000, #3533cd);">  
          <div class="metric-title">Accel</div>
          <div class="metric-value" id="circleGValue">-</div>
          <div class="metric-unit">G</div>
        </div>
      </div>
    </div>
  </div>

  <script src="live_data.js"></script>
</body>
</html>
