<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Live Telemetry</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/microsoft-signalr/7.0.5/signalr.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.155.0/build/three.min.js"></script>
  <script src="rocket3d.js"></script>
</head>
<body class="live-page">
  <div id="flightTimer"></div>

  <div class="live-container">
    <div id="top-row">
      <div id="top-left">
        <canvas id="altitudeChart" width="640" height="420"></canvas>
      </div>

      <div id="top-right">
        <div id="rocket3dContainer" class="white-circle hero-circle"></div>
      </div>
    </div>

    <div id="bottom-row">
      <div class="mode-section">
        <div class="mode-label">Rocket mode:</div>
        <div class="mode-pill">
          <div id="modeOn" class="mode-box">System Check</div>
          <div id="modeReady" class="mode-box">Operation Ready</div>
          <div id="modePending" class="mode-box">Lift-off</div>
          <div id="modeApogee" class="mode-box">Apogee</div>
          <div id="modeParachute" class="mode-box">Parachute Deployed</div>
        </div>
      </div>

      <div id="bottom-right"></div>
    </div>
  </div>

  <script src="live_data.js"></script>

  <div class="bottom-bar">
    <div class="bottom-bar-inner">
      <div class="metric-card large">
        <div class="metric-title">Height</div>
        <div class="metric-value" id="circleAltValue">-</div>
        <div class="metric-unit">m</div>
      </div>
      <div class="metric-card large">
        <div class="metric-title">Speed</div>
        <div class="metric-value" id="circleVelValue">-</div>
        <div class="metric-unit">m/s</div>
      </div>
      <div class="metric-card large">
        <div class="metric-title">Force</div>
        <div class="metric-value" id="circleGValue">-</div>
        <div class="metric-unit">G</div>
      </div>
    </div>
  </div>

  <div class="right-fixed-bar">
    <div class="right-inner"></div>
  </div>
</body>
</html>
